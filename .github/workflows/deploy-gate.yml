name: ClusterKit deploy gate

# Reusable gate: waits for the GCLB to actually serve, not just for Kubernetes
# to report a successful rollout.
#
# Why this exists: `kubectl rollout status` and the HTTPRoute Accepted/ResolvedRefs
# conditions all go green while the GCLB NEG backend is still failing health checks.
# On agent-status-codes' first automatic deploy that window was ~2 minutes of public
# 503s after CI had already reported success. Single-replica Spot pods make it worse:
# when the pod moves zone, there is exactly one NEG endpoint and nothing serves until
# the health check catches up in the new zone.
#
# Call this AFTER `helm upgrade` + `kubectl rollout status`, e.g.:
#
#   jobs:
#     gate:
#       needs: deploy
#       uses: prassanna-ravishankar/clusterkit/.github/workflows/deploy-gate.yml@main
#       with:
#         hostnames: webwhen.ai,api.webwhen.ai
#       secrets: inherit
#
# Auth: this workflow authenticates to GCP itself. A called workflow does NOT
# inherit the calling job's steps, so the caller's google-github-actions/auth
# does not carry over here. It needs `secrets: inherit` (for
# GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT) and declares its own
# `id-token: write` permission to mint the OIDC token.
#
# Each app has a dedicated gh-deploy-<app> SA; roles/container.developer is
# enough to read backend health.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      hostnames:
        description: 'Comma-separated public hostnames to verify (e.g. "webwhen.ai,api.webwhen.ai")'
        required: true
        type: string
      project_id:
        description: 'GCP project containing the Gateway'
        required: false
        default: 'baldmaninc'
        type: string
      gateway_url_map:
        description: 'GCLB url-map backing clusterkit-gateway'
        required: false
        default: 'gkegw1-tgkp-clusterkit-clusterkit-gateway-hko4nhd5tehf'
        type: string
      timeout_seconds:
        description: >-
          Per-stage budget, not per-backend or per-host. One deadline covers the
          whole backend-health stage and a fresh one covers the whole public-probe
          stage, so many backends share the same budget. gcloud calls are not
          individually wall-clocked, so a single hung call can overrun it.
        required: false
        default: 600
        type: number
      probe_interval_seconds:
        description: 'Gap between the two successful public observations'
        required: false
        default: 15
        type: number
      expected_status:
        description: 'HTTP status the public hostname should return'
        required: false
        default: '200'
        type: string
    secrets:
      # Secret names are NOT uniform across app repos: webwhen and bananagraph
      # use GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT, while repowire
      # uses GCP_WIF_PROVIDER / GCP_WIF_SERVICE_ACCOUNT. Both pairs are optional
      # and the job picks whichever is set, so `secrets: inherit` works for every
      # caller without renaming anything.
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false
      GCP_WIF_PROVIDER:
        required: false
      GCP_WIF_SERVICE_ACCOUNT:
        required: false

jobs:
  gate:
    name: Wait for GCLB to serve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required to mint the OIDC token for WIF
    steps:
      - name: Select WIF secrets
        id: wif
        env:
          PROVIDER_A: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA_A: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          PROVIDER_B: ${{ secrets.GCP_WIF_PROVIDER }}
          SA_B: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          # Select a COMPLETE pair atomically. Falling back per-variable would
          # let a half-configured pair A borrow pair B's service account and
          # authenticate a provider against a mismatched SA.
          if [ -n "${PROVIDER_A:-}" ] && [ -n "${SA_A:-}" ]; then
            provider="$PROVIDER_A"; sa="$SA_A"
          elif [ -n "${PROVIDER_B:-}" ] && [ -n "${SA_B:-}" ]; then
            provider="$PROVIDER_B"; sa="$SA_B"
          else
            echo "::error::No complete WIF secret pair found. Define BOTH of" \
                 "GCP_WORKLOAD_IDENTITY_PROVIDER+GCP_SERVICE_ACCOUNT or BOTH of" \
                 "GCP_WIF_PROVIDER+GCP_WIF_SERVICE_ACCOUNT, and map them via 'secrets:'."
            exit 1
          fi
          # GITHUB_ENV rather than step outputs: Actions may suppress outputs
          # whose values match masked secrets.
          echo "WIF_PROVIDER=$provider" >> "$GITHUB_ENV"
          echo "WIF_SA=$sa" >> "$GITHUB_ENV"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve backend services from the url-map
        id: resolve
        run: |
          set -euo pipefail
          # Backend service names are truncated and hash-suffixed
          # (agent-status-codes -> gkegw1-tgkp-agent-status-code-...), so they
          # cannot be derived from namespace/service. Read them out of the
          # url-map instead, which is authoritative.
          gcloud compute url-maps describe "${{ inputs.gateway_url_map }}" \
            --project "${{ inputs.project_id }}" --format=json > urlmap.json

          python3 - "${{ inputs.hostnames }}" <<'PY' | tee backends.txt
          import json, sys
          hosts = [h.strip() for h in sys.argv[1].split(',') if h.strip()]
          if not hosts:
              # ", ," is non-empty as a string but yields no hosts; without this
              # the gate would find nothing, check nothing, and pass.
              print("::error::'hostnames' contained no usable hostnames.", file=sys.stderr)
              sys.exit(1)
          d = json.load(open('urlmap.json'))
          matcher = {h: r['pathMatcher'] for r in d.get('hostRules', []) for h in r.get('hosts', [])}
          matchers = {p['name']: p for p in d.get('pathMatchers', [])}

          missing, found = [], set()
          for host in hosts:
              pm = matchers.get(matcher.get(host, ''), {})
              # The GKE Gateway controller emits weighted routeActions, but a
              # url-map can also carry plain `service` fields. Read every shape
              # rather than silently reporting "no backend" for a valid map.
              # Note: hostRules are matched exactly; wildcard hosts ("*.x.com")
              # will not match a concrete hostname here.
              names = set()
              for rr in pm.get('routeRules', []):
                  for w in rr.get('routeAction', {}).get('weightedBackendServices', []):
                      names.add(w['backendService'].rsplit('/', 1)[-1])
                  if rr.get('service'):
                      names.add(rr['service'].rsplit('/', 1)[-1])
              for pr in pm.get('pathRules', []):
                  if pr.get('service'):
                      names.add(pr['service'].rsplit('/', 1)[-1])
              if pm.get('defaultService'):
                  names.add(pm['defaultService'].rsplit('/', 1)[-1])
              # serve404 is the Gateway's catch-all, never a real backend.
              names = {n for n in names if 'serve404' not in n}
              if not names:
                  missing.append(host)
              found |= names

          if missing:
              print(f"::error::No GCLB backend for: {', '.join(missing)}. "
                    "HTTPRoute may not be attached to clusterkit-gateway yet.", file=sys.stderr)
              sys.exit(1)
          print('\n'.join(sorted(found)))
          PY

      - name: Wait for backends to report HEALTHY
        run: |
          set -euo pipefail

          # Exits 0 only when every NEG endpoint reports HEALTHY. An empty
          # endpoint list means the NEG has not been populated yet, which is
          # not healthy — hence the explicit `st and`.
          cat > check_health.py <<'PY'
          import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              sys.exit(1)
          st = [h.get('healthState') for b in d for h in b.get('status', {}).get('healthStatus', [])]
          print('  endpoints:', st or '(none yet)')
          sys.exit(0 if st and all(s == 'HEALTHY' for s in st) else 1)
          PY

          if ! grep -q '[^[:space:]]' backends.txt; then
            echo "::error::No backend services resolved; refusing to pass a gate that checked nothing."
            exit 1
          fi

          deadline=$(( $(date +%s) + ${{ inputs.timeout_seconds }} ))
          while read -r bs; do
            [ -n "$bs" ] || continue
            echo "::group::$bs"
            until gcloud compute backend-services get-health "$bs" --global \
                    --project "${{ inputs.project_id }}" --format=json 2>/dev/null \
                  | python3 check_health.py; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::$bs never became HEALTHY within ${{ inputs.timeout_seconds }}s"
                exit 1
              fi
              sleep 10
            done
            echo "HEALTHY"
            echo "::endgroup::"
          done < backends.txt

      - name: Wait for public hostnames to serve
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + ${{ inputs.timeout_seconds }} ))
          IFS=',' read -ra HOSTS <<< "${{ inputs.hostnames }}"
          for host in "${HOSTS[@]}"; do
            host="$(echo "$host" | xargs)"
            [ -n "$host" ] || continue
            # Two SPACED observations: a single 200 can land on an already-
            # converged zone while another is still catching up. They must be
            # separated in time and must not be served from cache, or "two
            # observations" is a guarantee in name only.
            streak=0
            until [ "$streak" -ge 2 ]; do
              # Assign explicitly: `$(curl ...) || echo 000` appends to curl's
              # own "000" on failure, producing "000000".
              if code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
                          -H 'Cache-Control: no-cache' \
                          "https://$host?_gate=$(date +%s)-$streak"); then
                :
              else
                code=000
              fi
              if [ "$code" = "${{ inputs.expected_status }}" ]; then
                streak=$((streak + 1))
                [ "$streak" -ge 2 ] || sleep "${{ inputs.probe_interval_seconds }}"
              else
                streak=0
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "::error::https://$host returned $code, expected ${{ inputs.expected_status }}"
                  exit 1
                fi
                sleep 10
              fi
            done
            echo "https://$host -> ${{ inputs.expected_status }}"
          done
